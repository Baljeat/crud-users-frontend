<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Users Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: "Segoe UI", Arial;
background: radial-gradient(circle at top, #0f2027, #203a43, #000);
color:#00f7ff;
min-height:100vh;
padding:40px;
}

/* grid background */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(#00f7ff22 1px, transparent 1px),
linear-gradient(90deg,#00f7ff22 1px, transparent 1px);
background-size:40px 40px;
pointer-events:none;
}

h1{
text-align:center;
margin-bottom:40px;
font-size:42px;
letter-spacing:3px;
text-shadow:0 0 10px #00f7ff;
}

/* card container */

.card{
width:600px;
margin:auto;
padding:20px;
border-radius:15px;
background:rgba(0,0,0,0.5);
backdrop-filter: blur(10px);
box-shadow:0 0 25px #00f7ff55;
}

/* table */

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
}

th{
background:#001f24;
padding:12px;
text-transform:uppercase;
letter-spacing:1px;
border-bottom:1px solid #00f7ff44;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #00f7ff22;
}

tr{
transition:0.3s;
}

tr:hover{
background:#002a30;
transform:scale(1.02);
box-shadow:0 0 10px #00f7ff55;
}

/* button */

.add-btn{
margin-top:20px;
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#00f7ff22;
color:#00f7ff;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.add-btn:hover{
background:#00f7ff44;
box-shadow:0 0 10px #00f7ff;
}

/* footer */

.footer{
margin-top:30px;
text-align:center;
opacity:0.7;
font-size:14px;
}

</style>
</head>

<body>

<h1>USERS DASHBOARD</h1>

<div class="card">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
</tr>
</thead>

<tbody id="users">
</tbody>

</table>

<button class="add-btn" onclick="reloadUsers()">
Reload Users
</button>

</div>

<div class="footer">
Powered by Node.js API + Render + Vercel
</div>

<script>

async function loadUsers(){

const res = await fetch("https://crud-user-uzzz.onrender.com/users")
const data = await res.json()

const table = document.getElementById("users")
table.innerHTML=""

data.forEach(user=>{

const row=document.createElement("tr")

row.innerHTML=`
<td>${user.id}</td>
<td>${user.name}</td>
`

table.appendChild(row)

})

}

function reloadUsers(){
loadUsers()
}

loadUsers()

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Users Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>USERS DASHBOARD</h1>

<div class="card">

<h2>Add User</h2>

<form id="userForm">
<input type="text" id="name" placeholder="Name" required>
<button type="submit" class="btn">Add User</button>
</form>

<div id="loading">Loading users...</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Action</th>
</tr>
</thead>

<tbody id="users"></tbody>
</table>

</div>

<footer>
Nhóm 10 - CRUD Users Demo
</footer>


<!-- USER DETAIL MODAL -->

<!-- USER DETAIL MODAL -->

<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>User Detail</h3>

    <!-- VIEW MODE -->
    <div id="viewMode">
      <p><b>ID:</b> <span id="detailDbId"></span></p>
      <p><b>MSSV:</b> <span id="detailId"></span></p>
      <p><b>Name:</b> <span id="detailName"></span></p>
      <button class="btn" onclick="enableEdit()">Edit</button>

    </div>
    <!-- EDIT MODE -->
    <div id="editMode" style="display:none">

      <p><b>ID:</b></p>
      <input id="editDbId" disabled>

      <p><b>MSSV:</b></p>
      <input id="editMssv">

      <p><b>Name:</b></p>
      <input id="editName">

      <div style="margin-top:12px">
        <button class="btn" onclick="updateUser()">Save</button>
        <button class="btn reload" onclick="cancelEdit()">Cancel</button>
      </div>

    </div>

  </div>
</div>


<script src="script.js"></script>

</body>
</html>
